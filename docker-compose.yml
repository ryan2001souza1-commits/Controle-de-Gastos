# =============================================================================
# docker-compose.yml — Ambiente de desenvolvimento local
# =============================================================================
# Sobe:
#   - PostgreSQL 18 com healthcheck
#   - FrankenPHP (container da aplicação)
#
# Uso:
#   docker compose up -d                 # subir
#   docker compose down -v              # parar e remover volumes
#   docker compose logs -f app          # ver logs da aplicação
#
# Acesse: http://localhost:8080
# =============================================================================

services:
  db:
    image: postgres:18-alpine
    container_name: controle_gastos_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123
      POSTGRES_DB: controle_gastos
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d controle_gastos"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: controle_gastos_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: controle_gastos
      DB_USER: postgres
      DB_PASS: 123
      APP_ENV: development
    ports:
      - "8080:8080"
    volumes:
      - ./:/app
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:
